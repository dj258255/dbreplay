# 실험 20: 글의 사례를 도커 자원 제한으로 따라 한다 (#89). MySQL 주 DB 하나와 종 DB 둘
name: dbreplay-exp20

x-mysql: &mysql
  image: mysql:8.4
  environment:
    MYSQL_ROOT_PASSWORD: replay
    MYSQL_DATABASE: sbtest
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-uroot", "-preplay", "--silent"]
    interval: 2s
    timeout: 2s
    retries: 60

x-pg-health: &pg-health
  test: ["CMD", "pg_isready", "-U", "postgres"]
  interval: 2s
  timeout: 2s
  retries: 60

services:
  mysql-primary:
    <<: *mysql
    command:
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --slow-query-log=OFF
      - --long-query-time=0
      - --log-output=FILE
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --log-slow-extra=ON
      - --max-connections=1000

  # 복제는 run.sh가 건다. 읽기 전용도 그 뒤에 건다. 시작 옵션으로 걸면 이미지의 초기화가 계정을 만들지 못한다
  mysql-replica:
    <<: *mysql
    command:
      - --server-id=2
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --slow-query-log=OFF
      - --long-query-time=0
      - --log-output=FILE
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --log-slow-extra=ON
      - --max-connections=1000

  mysql-replica2:
    <<: *mysql
    command:
      - --server-id=3
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --slow-query-log=OFF
      - --long-query-time=0
      - --log-output=FILE
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --log-slow-extra=ON
      - --max-connections=1000

