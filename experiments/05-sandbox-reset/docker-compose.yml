# 실험 05: 되돌린 뒤 기다리면 재생이 원본에 가까워지는가
name: dbreplay-exp05

services:
  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: replay
      MYSQL_DATABASE: sbtest
    command:
      - --slow-query-log=OFF
      - --long-query-time=0
      - --log-output=FILE
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --log-slow-extra=ON
      - --log-slow-admin-statements=ON
      - --max-connections=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-preplay", "--silent"]
      interval: 2s
      timeout: 2s
      retries: 60

  pg16:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: replay
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 60
