# 실험 14: 탐색을 되풀이해 낸 상한의 범위가 실행마다 겹치는가
name: dbreplay-exp14

services:
  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: replay
      MYSQL_DATABASE: sbtest
    command:
      - --slow-query-log=OFF
      - --long-query-time=0
      - --log-output=FILE
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --log-slow-extra=ON
      - --log-slow-admin-statements=ON
      - --max-connections=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-preplay", "--silent"]
      interval: 2s
      timeout: 2s
      retries: 60
