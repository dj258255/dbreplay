# 실험 04: PostgreSQL에서 녹화, 재생, 비교, 용량 탐색
name: dbreplay-exp04

services:
  pg16:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: replay
      POSTGRES_DB: shop
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=csvlog
      - -c
      - log_directory=log
      - -c
      - log_filename=pg.log
      - -c
      - log_rotation_age=0
      - -c
      - log_rotation_size=0
      - -c
      - log_timezone=UTC
      - -c
      - log_disconnections=on
      - -c
      - max_connections=300
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 60
