# 실험 07: 읽기만 늘 때의 상한은 전체가 함께 늘 때의 상한과 얼마나 다른가
name: dbreplay-exp07

services:
  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: replay
      MYSQL_DATABASE: sbtest
    command:
      - --slow-query-log=OFF
      - --long-query-time=0
      - --log-output=FILE
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --log-slow-extra=ON
      - --log-slow-admin-statements=ON
      - --max-connections=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-preplay", "--silent"]
      interval: 2s
      timeout: 2s
      retries: 60
